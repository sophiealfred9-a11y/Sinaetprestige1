version: '3.8'

services:
  web:
    image: caddy:latest
    container_name: sina-prestige-web
    ports:
      - "8080:80"
      - "443:443"
    volumes:
      - ../frontend:/srv:ro
      - ../docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - TZ=Europe/Paris
    restart: unless-stopped
    networks:
      - sina-network
    depends_on:
      - api
    labels:
      - "com.sina-prestige.description=Sina & Prestige Website"
      - "com.sina-prestige.version=2.0.0"

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: sina-prestige-api
    ports:
      - "5000:5000"
    environment:
      - ADMIN_EMAIL=contact@sinaetprestige.fr
      - SMTP_SERVER=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - FLASK_ENV=production
      - DATABASE_URL=sqlite:////data/submissions.db
    volumes:
      - api_data:/data
    restart: unless-stopped
    networks:
      - sina-network
    labels:
      - "com.sina-prestige.description=Sina & Prestige Contact API"
      - "com.sina-prestige.version=1.0.0"

networks:
  sina-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  api_data:
