version: '3.8'

services:
  web:
    image: ${DOCKER_REGISTRY:-docker.io}/${DOCKER_USERNAME}/sina-prestige-web:latest
    container_name: sina-prestige-web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - TZ=Europe/Paris
    restart: unless-stopped
    networks:
      - sina-network
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.sina-prestige.description=Sina & Prestige Website"
      - "com.sina-prestige.version=2.0.0"

  api:
    image: ${DOCKER_REGISTRY:-docker.io}/${DOCKER_USERNAME}/sina-prestige-api:latest
    container_name: sina-prestige-api
    ports:
      - "5000:5000"
    environment:
      - ADMIN_EMAIL=contact@sinaetprestige.fr
      - SMTP_SERVER=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - FLASK_ENV=production
      - DATABASE_URL=sqlite:////data/submissions.db
      - TZ=Europe/Paris
    volumes:
      - api_data:/data
    restart: unless-stopped
    networks:
      - sina-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.sina-prestige.description=Sina & Prestige Contact API"
      - "com.sina-prestige.version=1.0.0"

networks:
  sina-network:
    driver: bridge

volumes:
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  api_data:
    driver: local
