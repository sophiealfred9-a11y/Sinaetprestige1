<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <defs>
    <!-- Geometric Pattern with Logo Colors -->
    <pattern id="logoPattern" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <!-- Background -->
      <rect width="60" height="60" fill="#2c4f73"/>

      <!-- Circles pattern -->
      <circle cx="10" cy="10" r="3" fill="#2874b8" opacity="0.6"/>
      <circle cx="30" cy="30" r="2" fill="#f0f5fa" opacity="0.3"/>
      <circle cx="50" cy="10" r="2.5" fill="#2874b8" opacity="0.4"/>
      <circle cx="20" cy="50" r="3" fill="#f0f5fa" opacity="0.25"/>
      <circle cx="40" cy="50" r="2" fill="#2874b8" opacity="0.5"/>
      <circle cx="60" cy="30" r="2.5" fill="#f0f5fa" opacity="0.35"/>

      <!-- Lines -->
      <line x1="15" y1="0" x2="15" y2="60" stroke="#2874b8" stroke-width="0.5" opacity="0.2"/>
      <line x1="45" y1="0" x2="45" y2="60" stroke="#2874b8" stroke-width="0.5" opacity="0.2"/>
      <line x1="0" y1="20" x2="60" y2="20" stroke="#2874b8" stroke-width="0.5" opacity="0.15"/>
      <line x1="0" y1="40" x2="60" y2="40" stroke="#2874b8" stroke-width="0.5" opacity="0.15"/>
    </pattern>

    <!-- Gradient overlays -->
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c4f73;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#2874b8;stop-opacity:0.95" />
    </linearGradient>
  </defs>
</svg>
